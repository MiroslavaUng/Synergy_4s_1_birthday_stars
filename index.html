<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday stars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Дата рождения</h1>
        
        <div class="input-group">
            <label for="day">День:</label>
            <input type="number" id="day" min="1" max="31" placeholder="1-31">
        </div>
        <div class="input-group">
            <label for="month">Месяц:</label>
            <input type="number" id="month" min="1" max="12" placeholder="1-12">
        </div>
        <div class="input-group">
            <label for="year">Год:</label>
            <input type="number" id="year" min="1900" max="2100" placeholder="ГГГГ">
        </div>
        
        <button onclick="runProgram()">Выполнить</button>

        <div id="result"></div>
    </div>

    <!-- Подключаем файлы: сначала логика, потом отрисовка, потом главный скрипт -->
    <script src="birthday.js"></script>
    <script src="stars.js"></script>
    <script>
        // Главная функция, которая связывает всё воедино
        function runProgram() {
            const day = Number(document.getElementById('day').value);
            const month = Number(document.getElementById('month').value);
            const year = Number(document.getElementById('year').value);

            if (!day || !month || !year) {
                alert("Пожалуйста, заполните все поля!");
                return;
            }

            // Проверка корректности даты (например, чтобы не было 31 февраля)
            const testDate = new Date(year, month - 1, day);
            if (testDate.getDate() !== day || testDate.getMonth() + 1 !== month) {
                alert("Введена некорректная дата (например, 31 февраля не существует)!");
                return;
            }

            // --- 1. Вывод в консоль ---
            console.log("--- РЕЗУЛЬТАТЫ ВЫПОЛНЕНИЯ ---");
            console.log("День недели:", getDayOfWeek(day, month, year));
            console.log("Високосный год?", isLeapYear(year) ? "Да" : "Нет");
            console.log("Возраст:", getAge(day, month, year), "лет");
            console.log("Дата звёздочками:\n" + renderStarDate(day, month, year));

            // --- 2. Вывод на страницу ---
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="info-line">День недели: <span class="highlight">${getDayOfWeek(day, month, year)}</span></div>
                <div class="info-line">Високосный год: <span class="highlight">${isLeapYear(year) ? "Да" : "Нет"}</span></div>
                <div class="info-line">Ваш возраст: <span class="highlight">${getAge(day, month, year)}</span></div>
            `;
        }
    </script>
</body>
</html>
